# Shipped disabled: point the mlab_*_events macros at your data, then enable the ones you want.
# To send them to ir.mlab.sh, set action.mlab_ir = 1 (and the ir.mlab.sh URL + token, see README).

[mlab - Known malicious file]
cron_schedule = */15 * * * *
dispatch.earliest_time = -16m@m
dispatch.latest_time = -1m@m
enableSched = 1
disabled = 1
alert.track = 1
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.mlab_ir = 0
description = File hash that mlab.sh knows as malicious.
search = `mlab_hash_events` | stats count min(_time) as first_seen max(_time) as last_seen values(dest) as dest values(file_path) as file_path by file_hash | mlab type=hash | search mlab_verdict=known_malicious
alert.severity = 4
action.mlab_ir.param.severity = high

[mlab - Suspicious URL]
cron_schedule = */15 * * * *
dispatch.earliest_time = -16m@m
dispatch.latest_time = -1m@m
enableSched = 1
disabled = 1
alert.track = 1
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.mlab_ir = 0
description = URL with a high or critical mlab.sh finding.
search = `mlab_url_events` | stats count min(_time) as first_seen max(_time) as last_seen values(src) as src values(dest) as dest by url | mlab type=url | search mlab_severities=high OR mlab_severities=critical
alert.severity = 3
action.mlab_ir.param.severity = medium

[mlab - Tor exit node]
cron_schedule = */15 * * * *
dispatch.earliest_time = -16m@m
dispatch.latest_time = -1m@m
enableSched = 1
disabled = 1
alert.track = 1
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.mlab_ir = 0
description = Authentication failures from a Tor exit node (public IPs only; mlab.sh IP lookups are quota'd).
search = `mlab_ip_events` | stats count min(_time) as first_seen max(_time) as last_seen values(user) as user values(dest) as dest by src | mlab type=ip | search mlab_tor=true
alert.severity = 2
action.mlab_ir.param.severity = low

[mlab - Known exploited CVE]
cron_schedule = */15 * * * *
dispatch.earliest_time = -16m@m
dispatch.latest_time = -1m@m
enableSched = 1
disabled = 1
alert.track = 1
alert.digest_mode = 1
counttype = number of events
relation = greater than
quantity = 0
action.mlab_ir = 0
description = Vulnerability in the CISA KEV catalog (exploited in the wild).
search = `mlab_cve_events` | stats count min(_time) as first_seen max(_time) as last_seen values(dest) as dest by cve | mlab type=cve | search mlab_in_kev=true
alert.severity = 5
action.mlab_ir.param.severity = critical
