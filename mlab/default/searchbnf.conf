[mlab-command]
syntax = mlab type=(hash|url|ip|cve) (field=<field>)?
shortdesc = Enrich results with mlab.sh verdicts.
description = Looks up the value of field (default: file_hash, url, src, cve) on mlab.sh \
    and adds mlab_type, mlab_value and mlab_* fields. Private IPs are never sent. \
    Results are cached 24h on the search head; a kind that hits its quota is paused for an hour.
usage = public
example1 = ... | stats count by file_hash | mlab type=hash | search mlab_verdict=known_malicious
comment1 = Flag known malicious file hashes.
example2 = ... | stats count by src | mlab type=ip | search mlab_tor=true
comment2 = Flag Tor exit nodes.
related = lookup
tags = mlab threatintel enrichment
