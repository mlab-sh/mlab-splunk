[mlab-command]
syntax = mlab type=(hash|url|ip|cve|domain|email|ioc) (field=<field>)?
shortdesc = Enrich results with mlab.sh verdicts.
description = Looks up the value of field (default: file_hash, url, src, cve, query, src_user, _raw) on mlab.sh \
    and adds mlab_type, mlab_value and mlab_* fields. Private IPs are never sent. type=domain reads the last \
    mlab.sh scan report of the domain (it never launches one), type=ioc extracts the indicators of a text field. \
    Results are cached 24h on the search head; a kind that hits its quota, or whose X-RateLimit-Remaining \
    reaches 0, is paused for an hour. A refused (expired) API key stops the lookups of that search.
usage = public
example1 = ... | stats count by file_hash | mlab type=hash | search mlab_verdict=known_malicious
comment1 = Flag known malicious file hashes.
example2 = ... | stats count by src | mlab type=ip | search mlab_tor=true
comment2 = Flag Tor exit nodes.
example3 = ... | stats count by query | mlab type=domain | search mlab_grade=F
comment3 = Domains whose last mlab.sh scan graded F.
example4 = ... | stats count by src_user | mlab type=email | search mlab_is_disposable=true
comment4 = Senders on disposable mail domains.
example5 = ... | head 100 | mlab type=ioc | mvexpand mlab_iocs
comment5 = One row per indicator found in the raw events.
related = lookup
tags = mlab threatintel enrichment
